name: Run Lint
run-name: "Run Lint: ${{ github.ref_type }} ${{ github.ref_name }} by ${{ github.triggering_actor }}"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "03 00 * * *"

jobs:
  lint:
    name: Run Lint
    runs-on: self-hosted-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      # The dev extra pulls in every tool below, and rms-oops[docs] with it.
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # Each gate is its own step, so a failure names itself. The set and the
      # arguments match scripts/run-all-checks.sh, which is authoritative; the pytest
      # suites belong to run-tests.yml and are not repeated here.

      - name: Run ruff
        run: |
          python -m ruff check .

      # Ruff implements no rule in the E121-E133 range, so the continuation-line
      # indent checks come from flake8 and nothing else.
      - name: Run flake8 (continuation-line checks only)
        run: |
          python -m flake8 --select=E12,E13 src programs tests

      # The tests only; src carries no annotations by house rule.
      - name: Run mypy
        run: |
          python -m mypy

      # A stub replaces its module outright for a type checker, so stubtest is what
      # keeps each one complete. MYPYPATH names src/ because the library packages live
      # there and the editable install's import hook is invisible to mypy.
      # --ignore-missing-stub is needed because only the package stubs exist; the
      # modules below each package are read from source instead.
      - name: Run stubtest
        env:
          MYPYPATH: src
        run: |
          python -m mypy.stubtest oops spicedb programs \
              --mypy-config-file pyproject.toml \
              --allowlist stubtest-allowlist.txt \
              --ignore-missing-stub

      - name: Run pyroma
        run: |
          python -m pyroma --min=10 .

      - name: Run bandit
        run: |
          python -m bandit -q -c pyproject.toml -r src

      - name: Run vulture
        run: |
          python -m vulture

      # -W makes a warning fail the build; -n reports every cross-reference that
      # resolves to nothing; -E rebuilds from scratch so a cached page cannot hide one.
      # This step needs no SPICE kernels: conf.py mocks cspyce.
      - name: Build the documentation
        run: |
          python -m sphinx -W -n -E -b html docs docs/_build/html
